{% extends "base.html" %}
{% set css_file = 'leads_manager/services/edit_lead.css' %}
{% block content %}
    <main>
        <div id="container-main">
            <h1>{{ header_title }}</h1>
            <form id="form-content" method="POST" action="{{ url_for('leads.update_lead') }}">
                <input class="lead-input-select" type="hidden" name="lead_id" value="{{ lead.id }}">

                <label for="name">Nome:</label>
                <input class="lead-input-select" type="text" id="name" name="name" value="{{ lead.nome }}" required>

                <label for="plan">Telefone:</label>
                <input class="lead-input-select" type="text" id="plan" name="plan" value="{{ lead.telefone }}" required>

                <label for="lead_status">Status:</label>
                <select class="lead-input-select" name="lead_status" id="lead_status" required>
                    <option value="pending" {% if lead.status == 'pending' %}selected{% endif %}>Pendente</option>
                    <option value="in_progress" {% if lead.status == 'in_progress' %}selected{% endif %}>Em Andamento</option>
                    <option value="completed" {% if lead.status == 'completed' %}selected{% endif %}>Finalizado</option>
                    <option value="cancelled" {% if lead.status == 'cancelled' %}selected{% endif %}>Cancelado</option>
                </select>
                {% if comments %}
                    <label for="old_comments">Comentários antigos:</label>
                    {% for comment in comments %}
                        <textarea class="lead-input-select" disabled>{{ comment.comentario }}</textarea>
                    {% endfor %}
                {% endif %}

                <label for="lead_comentario">Adicionar Comentário:</label>
                <textarea class="lead-input-select" name="lead_comentario" id="lead_comentario"></textarea>

                <label for="invite">produto de Interesse:</label>
                <input class="lead-input-select" type="text" id="invite" name="invite" value="{{ lead.produto }}" required>

                <label for="produto">Cidade:</label>
                <input class="lead-input-select" type="text" name="cidade" id="cidade" value="{{ lead.cidade }}">

                <button class="save-lead-btn" type="submit">Salvar Alterações</button>
                <a id="cancel-button" href="{{ url_for('leads.leads_main') }}">Cancelar</a>
            </form>
        </div>
    </main>
{% endblock %}
