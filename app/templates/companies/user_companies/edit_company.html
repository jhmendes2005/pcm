{% extends "base.html" %}
{% set css_file = 'companies/user_companies/edit_company.css' %}
{% block content %}
    <main id="container-main">
        <h1>{{ header_title }}</h1>
        <form id="form-content" method="POST" action="{{ url_for('companies.companies_edit', id=company.id) }}">
            
            <label for="name">Nome da Empresa:</label>
            <input type="text" id="name" name="name" value="{{ company.nome }}" required class="lead-input-select">

            <label for="plan">Plano:</label>
            <input type="text" id="plan" name="plan" value="{{ company.plan }}" readonly class="lead-input-select">

            <label for="cnpj">CNPJ:</label>
            <input type="text" id="cnpj" name="cnpj" value="{{ company.cnpj }}" required class="lead-input-select">

            <label for="invite">Invite ID:</label>
            <input type="text" id="invite" name="invite" value="{{ company.invite }}" required class="lead-input-select">

            <label for="invite">Token API:</label>
            <input type="text" id="invite" name="invite" value="{{ company.token_api }}" required class="lead-input-select">
            

            <label for="btprod">Tipo de Item (Produto, Veículo ou etc):</label>
            <input type="btprod" id="btprod" name="btprod" value="{{ company.bt_type_product }}" required class="lead-input-select">

            <label for="btaction"> Botão de Ação (Finalizar, Agendar ou etc):</label>
            <input type="btaction" id="btaction" name="btaction" value="{{ company.bt_action }}" required class="lead-input-select">


            <label for="collaborator">Colaboradores:</label>
            <div class="collaborator-group">
                {% for employee in employees %}
                    <div class="collaborator-item">
                        <input type="text" id="collaborator" name="collaborator" value="{{ employee.name }} | ID - {{ employee.id }}" readonly class="lead-input-select">
                        <a href="{{ url_for('companies.companies_remove_employee', id=employee.id) }}" class="button-remove">Remover</a>
                    </div>
                {% endfor %}
            </div>
        
            <button type="submit" class="add-lead-btn">Salvar Alterações</button>
            <a href="{{ url_for('companies.companies_page') }}">Cancelar</a> <!-- Link para retornar à lista de empresas -->
        </form>
    </main>
{% endblock %}
