{% extends "base.html" %}
{% set css_file = 'user/services/reset_password.css' %}
{% block content %}
    <main id="container-main">
        <h1>Redefinir Senha</h1>
        <form id="form-content" method="POST" onsubmit="showLoader()">
            <label for="code">Código de validação:</label>
            <input class="lead-input-select" type="text" name="code" placeholder="Código de Redefinição" value="{{ code_string }}" required>
            <label for="password">Nova Senha:</label>
            <input class="lead-input-select" type="password" name="password" placeholder="Nova Senha" required>
            <button class="send-btn" type="submit">Redefinir Senha</button>
        </form>
    </main>
{% endblock %}
